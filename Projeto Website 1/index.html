<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body class="dark-mode">
    <header>
        <nav class="leftNav">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Beneficios</a></li>
                <li><a href="#">Planos</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>

        <figure>
            <img src="https://logolook.net/wp-content/uploads/2023/10/Adidas-Logo.png" alt="Adidas Logo">
        </figure>  
        
        <nav class="rightNav">
            <ul>
                <li><a href="#">Lojas</a></li>
                <li><a href="#">Sobre</a></li>
            </ul>
        </nav>        
    </header>
    <main>
        <hr>
        
        <div id="homePresentation">
            <img id="adidasLogo" src="https://upload.wikimedia.org/wikipedia/commons/1/1c/Adidas-group-logo-fr.svg?utm_source=pt.wikipedia.org&utm_campaign=index&utm_content=original" alt="Logo da adidas em texto">
            <h2>Onde o esporte encontra a sua história. <br> crie o seu próprio legado e mude o jogo.</h2>

            <article>
                <h2>NOVO LEGO SUPERSTAR</h2>
                <figure>
                    <img src="https://wwd.com/wp-content/uploads/2021/06/AdidasSuperstarLego.jpg?w=1000&h=563&crop=1" alt="Adidas Shoes Image">
                </figure>
            </article>
        </div>
    </main>
        <footer>
            <button class="themeButton" onclick="changeTheme()">
                <span id="lighticon" class="material-symbols-outlined">
                light_mode
                </span>
                <span id="darkicon" class="material-symbols-outlined">
                dark_mode
                </span>             
            </button>
        </footer>

        <script>
            const button = document.querySelector("button")

            button.onclick = () => {
                document.body.classList.toggle("dark-mode")
                button.classList.toggle("dark-mode")                
            }
        </script>
</body>
</html>
